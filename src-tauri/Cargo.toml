[package]
name = "daycell"
version = "1.1.0"
description = "DayCell 桌面壳：logo 悬浮球 + 常驻面板的 PWA"
authors = ["yiduanzhi"]
license = ""
repository = "https://github.com/Yiduanzhi-ops/DayCell"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
