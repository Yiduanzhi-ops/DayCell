<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DayCell · 习惯模块原型 v0.1</title>
<style>
/* ============ 设计令牌（与主应用一致） ============ */
:root{
  --accent:#2E4BA6;
  --bg:#FFFFFF;
  --bg-subtle:#FAFAFA;
  --bg-hover:#F5F5F5;
  --ink:#1A1A1A;
  --ink-2:#555555;
  --ink-3:#767676;
  --ink-4:#C4C4C4;
  --line:#EBEBEB;
  --line-2:#F4F4F4;
  --accent-soft:color-mix(in srgb, var(--accent) 8%, #fff);
  --accent-line:color-mix(in srgb, var(--accent) 28%, #fff);
  --green:#2E7D4F;
  --green-soft:color-mix(in srgb, #2E7D4F 8%, #fff);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:#E9E9EC;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.phone-note{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:99;background:#1B1B1F;color:#EDEDF0;
  padding:5px 14px;border-radius:99px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}

.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:64px 12px}
.device{width:390px;max-width:390px;height:800px;background:var(--bg);border-radius:38px;border:9px solid #1B1B1F;
  overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.3)}

/* ============ 顶栏 ============ */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line);position:relative}
.topbar .back{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:18px;display:none}
.topbar .back:hover{background:var(--bg-hover)}
.topbar h1{font-size:17px;font-weight:650;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px}
.brand-mark{width:18px;height:18px;border-radius:5px;background:var(--accent);position:relative;flex:0 0 auto}
.brand-mark::after{content:"";position:absolute;inset:6px 4px auto 4px;height:2px;background:#fff;border-radius:1px;box-shadow:0 5px 0 #fff}
.menu{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:17px;letter-spacing:2px}
.menu:hover{background:var(--bg-hover)}

/* 菜单下拉 */
.menu-pop{position:absolute;top:52px;right:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.12);z-index:70;min-width:150px;display:none;overflow:hidden}
.menu-pop.on{display:block}
.menu-pop button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:13.5px}
.menu-pop button:hover{background:var(--bg-hover)}
.menu-pop .sep{height:1px;background:var(--line-2);margin:4px 0}

/* ============ 滚动区 ============ */
.scroll{flex:1;overflow-y:auto;padding:0 18px 92px}
.page{display:none}
.page.on{display:block}

/* ---- 日期头 ---- */
.day-head{display:flex;align-items:baseline;gap:8px;padding:12px 0 2px}
.day-head .d{font-size:19px;font-weight:700;letter-spacing:-.01em}
.day-head .w{font-size:13px;color:var(--ink-3);font-weight:600}

/* ---- 区块 ---- */
.sec{margin-top:16px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sec-head .t{font-size:12.5px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
.sec-head .count{font-size:11.5px;color:var(--accent);font-weight:650}
.sec-head .sp{flex:1}
.sec-head .add{color:var(--accent);font-size:12.5px;font-weight:600}

/* 待办行（展示用） */
.todo{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.todo .dot{width:17px;height:17px;border-radius:99px;border:1.5px solid var(--ink-4);flex:0 0 auto}
.todo.done .dot{background:var(--accent);border-color:var(--accent);display:grid;place-items:center}
.todo.done .dot::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.todo.done .txt{color:var(--ink-4);text-decoration:line-through}
.todo .txt{flex:1;font-size:14px}

/* ---- 习惯区块 ---- */
.habit-box{margin-top:14px;border:1px solid var(--accent-line);border-radius:14px;background:var(--accent-soft);padding:4px 14px 8px}
.habit-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed color-mix(in srgb,var(--accent) 18%,#fff)}
.habit-row:last-child{border-bottom:none}
.habit-row .check{width:22px;height:22px;border-radius:99px;border:2px solid var(--ink-4);flex:0 0 auto;display:grid;place-items:center;transition:all .15s}
.habit-row .check svg{opacity:0;width:12px;height:12px}
.habit-row.on .check{background:var(--accent);border-color:var(--accent)}
.habit-row.on .check svg{opacity:1}
.habit-row .name{font-size:14px;font-weight:600;flex:1}
.habit-row.on .name{color:var(--ink-3)}
.habit-row .freq{font-size:10.5px;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 7px;letter-spacing:.02em}
.habit-row.on .freq{opacity:.55}

/* ---- 想法行 ---- */
.note{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.note .txt{flex:1;font-size:14px;color:var(--ink-2)}

/* ============ 习惯设置页 ============ */
.settings-title{padding:16px 0 4px;font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.habit-card{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:10px}
.habit-card.paused{opacity:.5}
.habit-card .name{font-size:14.5px;font-weight:600;flex:1}
.habit-card .freq{font-size:10.5px;color:var(--ink-3);background:var(--bg-hover);border-radius:99px;padding:2px 8px}
.habit-card .pause{width:38px;height:20px;border-radius:99px;background:var(--green);position:relative;flex:0 0 auto}
.habit-card .pause::after{content:"";position:absolute;top:2px;left:20px;width:16px;height:16px;border-radius:99px;background:#fff}
.habit-card.paused .pause{background:var(--ink-4)}
.habit-card.paused .pause::after{left:2px}
.habit-card .del{color:#C0392B;font-size:12px;font-weight:600;padding:4px 6px}
.new-habit{margin-top:14px;width:100%;padding:11px 0;border-radius:11px;background:var(--accent);color:#fff;font-size:14px;font-weight:650}

/* ============ 底部 tab ============ */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600}
.tab .ic{width:22px;height:22px;display:grid;place-items:center}
.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* ============ 弹层：新建习惯 ============ */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.34);z-index:80;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow-y:auto}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:16px;font-weight:650;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--bg);outline:none}
.field input:focus{border-color:var(--accent)}
/* 频率选择：每天单选 / 每周多选 */
.freq-mode{display:flex;gap:10px;margin-bottom:10px}
.freq-mode button{flex:1;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);color:var(--ink-2)}
.freq-mode button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.week-chips{display:flex;gap:6px;flex-wrap:wrap}
.week-chips button{width:38px;height:38px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.week-chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.week-chips.hidden{display:none}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.act{display:flex;gap:10px;margin-top:18px}
.act button{flex:1;padding:11px 0;border-radius:11px;font-size:14.5px;font-weight:650}
.btn-soft{background:var(--bg-hover);color:var(--ink-2)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:.5}

/* 演示提示条 */
.demo-tip{position:absolute;top:0;left:0;right:0;background:#FFF8E1;color:#7A5C00;font-size:11.5px;text-align:center;
  padding:5px 12px;z-index:60;display:none;line-height:1.5}
.demo-tip.on{display:block}
</style>
</head>
<body>
<div class="phone-note">DayCell 习惯模块 · 可点击原型（勾习惯 / 菜单进设置 / 新建习惯）</div>
<div class="stage"><div class="device">

  <div class="demo-tip" id="tip">已打卡：喝水 ✓（习惯只记当天，不产生"昨天的欠账"）</div>

  <!-- 顶栏 -->
  <div class="topbar">
    <button class="back" id="backBtn" title="返回今天">←</button>
    <h1 id="topTitle"><span class="brand-mark"></span>今天</h1>
    <button class="menu" id="menuBtn" title="菜单">⋯</button>
    <div class="menu-pop" id="menuPop">
      <button onclick="closeMenu()">导出备份</button>
      <button onclick="closeMenu()">导入备份</button>
      <button onclick="closeMenu()">一键导出 MD</button>
      <button onclick="closeMenu()">纪念日设置</button>
      <button onclick="openSettings()">习惯设置</button>
      <div class="sep"></div>
      <button onclick="closeMenu()">夜间模式</button>
      <button onclick="closeMenu()">关于</button>
    </div>
  </div>

  <!-- ============ 页面 1：今天视图 ============ -->
  <div class="scroll page on" id="page-day">
    <div class="day-head">
      <span class="d">10月8日</span><span class="w">周四</span>
    </div>

    <!-- 待办区块（原样保留） -->
    <section class="sec">
      <div class="sec-head"><span class="t">待办</span><span class="count">1/2</span><span class="sp"></span><span class="add">＋ 添加</span></div>
      <div class="todo"><span class="dot"></span><span class="txt">回客户邮件</span></div>
      <div class="todo done"><span class="dot"></span><span class="txt">买牛奶</span></div>
    </section>

    <!-- 习惯区块（新增：v8.0） -->
    <section class="sec">
      <div class="sec-head">
        <span class="t">今日习惯</span><span class="count" id="habitCount">1/3</span><span class="sp"></span>
        <span class="add" onclick="openSettings()">管理</span>
      </div>
      <div class="habit-box" id="habitBox">
        <!-- 由 JS 渲染，见下 -->
      </div>
    </section>

    <!-- 想法区块（原样保留；花费区块已去掉） -->
    <section class="sec">
      <div class="sec-head"><span class="t">想法</span><span class="sp"></span><span class="add">＋ 添加</span></div>
      <div class="note"><span class="txt">今天把习惯做成独立区块，跟待办分开。</span></div>
    </section>
  </div>

  <!-- ============ 页面 2：习惯设置 ============ -->
  <div class="scroll page" id="page-settings">
    <div class="settings-title">我的习惯（<span id="habitTotal">3</span>）</div>
    <div id="habitList"></div>
    <button class="new-habit" onclick="openNew()">＋ 新建习惯</button>
  </div>

  <!-- ============ 弹层：新建 / 编辑习惯 ============ -->
  <div class="overlay" id="ov-new">
    <div class="sheet">
      <div class="grab"></div>
      <h3 id="newTitle">新建习惯</h3>
      <div class="field"><label>习惯名称</label><input type="text" id="hName" placeholder="如：多喝水 / 运动 30 分钟" value="多喝水"/></div>
      <div class="field">
        <label>频率</label>
        <div class="freq-mode">
          <button id="fmDaily" class="on" onclick="setFreqMode('daily')">每天</button>
          <button id="fmWeekly" onclick="setFreqMode('weekly')">每周</button>
        </div>
        <div class="week-chips hidden" id="weekChips">
          <button data-d="1" onclick="toggleDay(this)">一</button>
          <button data-d="2" onclick="toggleDay(this)">二</button>
          <button data-d="3" onclick="toggleDay(this)">三</button>
          <button data-d="4" onclick="toggleDay(this)">四</button>
          <button data-d="5" onclick="toggleDay(this)">五</button>
          <button data-d="6" onclick="toggleDay(this)">六</button>
          <button data-d="0" onclick="toggleDay(this)">日</button>
        </div>
        <p class="hint">每周模式下：习惯只在选中的星期几出现在「今日习惯」里。</p>
      </div>
      <div class="act">
        <button class="btn-soft" onclick="closeNew()">取消</button>
        <button class="btn-primary" id="saveBtn" onclick="saveHabit()">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 底部 tab ============ -->
  <div class="tabbar">
    <button class="tab on"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg></span>今天</button>
    <button class="tab"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h10"/></svg></span>周</button>
    <button class="tab"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9h17M9 3.5V21"/></svg></span>月</button>
    <button class="tab"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.2L20 9.2l-4 4.1.9 5.7L12 16.4 7.1 19l.9-5.7-4-4.1 5.6-1z"/></svg></span>目标</button>
  </div>

</div></div>

<script>
// ---- 习惯数据（演示） ----
// freq: { everyDay: true } | { weekdays: [0..6] }（0=周日）；今天 2026-10-08 是周四(4)
let habits = [
  { id: 'h1', name: '多喝水', freq: { everyDay: true } },
  { id: 'h2', name: '运动 30 分钟', freq: { everyDay: true } },
  { id: 'h3', name: '阅读 20 页', freq: { weekdays: [2, 4, 6] } }, // 周二四六
]
const TODAY_DOW = 4 // 周四
let doneIds = new Set(['h1'])

// ---- 渲染：今日习惯（只显示"今天该做"的） ----
function dueToday(h) {
  return h.freq.everyDay ? true : h.freq.weekdays.includes(TODAY_DOW)
}
function renderHabits() {
  const due = habits.filter(dueToday)
  const box = document.getElementById('habitBox')
  box.innerHTML = due.map(h => {
    const on = doneIds.has(h.id) ? 'on' : ''
    const freqTxt = h.freq.everyDay ? '每天' : '每周·' + h.freq.weekdays.map(d=>'日一二三四五六'[d]).join('')
    return `<div class="habit-row ${on}" data-id="${h.id}">
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="name">${h.name}</span>
      <span class="freq">${freqTxt}</span>
    </div>`
  }).join('')
  document.querySelectorAll('.habit-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id
      if (doneIds.has(id)) doneIds.delete(id); else doneIds.add(id)
      renderHabits()
      showTip(`已打卡：${habits.find(x=>x.id===id).name} ✓（习惯只记当天，不产生"昨天的欠账"）`)
    })
  })
  document.getElementById('habitCount').textContent = `${doneIds.size}/${due.length}`
}
function renderList() {
  const list = document.getElementById('habitList')
  list.innerHTML = habits.map(h => {
    const freqTxt = h.freq.everyDay ? '每天' : '每周·' + h.freq.weekdays.map(d=>'日一二三四五六'[d]).join('')
    return `<div class="habit-card" data-id="${h.id}">
      <span class="name">${h.name}</span>
      <span class="freq">${freqTxt}</span>
      <span class="pause" onclick="togglePause(this)" title="暂停/恢复"></span>
      <button class="del" onclick="delHabit('${h.id}')">删除</button>
    </div>`
  }).join('') || '<div style="text-align:center;color:var(--ink-3);padding:30px 0">还没有习惯</div>'
  document.getElementById('habitTotal').textContent = habits.length
}
function togglePause(el) {
  const card = el.closest('.habit-card')
  card.classList.toggle('paused')
  const h = habits.find(x => x.id === card.dataset.id)
  h.paused = !h.paused
  showTip(h.paused ? `已暂停「${h.name}」，暂停期间不出现在今日习惯` : `已恢复「${h.name}」`)
}
function delHabit(id) {
  habits = habits.filter(x => x.id !== id)
  doneIds.delete(id)
  renderList(); renderHabits()
  showTip('习惯已删除')
}

// ---- 页面切换 ----
const pages = { day: document.getElementById('page-day'), settings: document.getElementById('page-settings') }
const backBtn = document.getElementById('backBtn')
function showPage(name) {
  pages.day.classList.toggle('on', name === 'day')
  pages.settings.classList.toggle('on', name === 'settings')
  backBtn.style.display = name === 'settings' ? 'grid' : 'none'
  document.getElementById('topTitle').innerHTML = name === 'day'
    ? '<span class="brand-mark"></span>今天'
    : '<span class="brand-mark"></span>习惯设置'
}
backBtn.addEventListener('click', () => showPage('day'))

// ---- 菜单 ----
function closeMenu() { document.getElementById('menuPop').classList.remove('on') }
document.getElementById('menuBtn').addEventListener('click', (e) => {
  e.stopPropagation()
  document.getElementById('menuPop').classList.toggle('on')
})
document.addEventListener('click', () => closeMenu())
function openSettings() { closeMenu(); showPage('settings') }

// ---- 新建习惯弹层 ----
let freqMode = 'daily'
let selDays = new Set()
function openNew() {
  document.getElementById('hName').value = ''
  setFreqMode('daily')
  document.querySelectorAll('#weekChips button').forEach(b => b.classList.remove('on'))
  selDays = new Set()
  document.getElementById('ov-new').classList.add('on')
}
function closeNew() { document.getElementById('ov-new').classList.remove('on') }
document.getElementById('ov-new').addEventListener('click', e => { if (e.target === e.currentTarget) closeNew() })
function setFreqMode(m) {
  freqMode = m
  document.getElementById('fmDaily').classList.toggle('on', m === 'daily')
  document.getElementById('fmWeekly').classList.toggle('on', m === 'weekly')
  document.getElementById('weekChips').classList.toggle('hidden', m !== 'weekly')
  updateSave()
}
function toggleDay(btn) {
  btn.classList.toggle('on')
  const d = Number(btn.dataset.d)
  if (selDays.has(d)) selDays.delete(d); else selDays.add(d)
  updateSave()
}
function updateSave() {
  const ok = document.getElementById('hName').value.trim() && (freqMode === 'daily' || selDays.size > 0)
  document.getElementById('saveBtn').disabled = !ok
}
document.getElementById('hName').addEventListener('input', updateSave)
function saveHabit() {
  const name = document.getElementById('hName').value.trim()
  if (!name) return
  if (freqMode === 'weekly' && selDays.size === 0) return
  habits.push({
    id: 'h' + Date.now(),
    name,
    freq: freqMode === 'daily' ? { everyDay: true } : { weekdays: [...selDays].sort() },
  })
  closeNew()
  renderList(); renderHabits()
  showTip(`已新建习惯「${name}」`)
}

// ---- 提示条 ----
let tipTimer
function showTip(msg) {
  const t = document.getElementById('tip')
  t.textContent = msg
  t.classList.add('on')
  clearTimeout(tipTimer)
  tipTimer = setTimeout(() => t.classList.remove('on'), 2600)
}

renderHabits(); renderList()
</script>
</body>
</html>
